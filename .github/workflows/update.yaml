name: Update README

on:
  schedule:
    - cron: "0 4 * * *"    # Midnight UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python update_details.py

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add README.md

          # Exit cleanly if nothing changed
          git diff --cached --quiet && exit 0

          git commit -m "Update uptime"

          # Sync with latest remote to avoid non-fast-forward push failures
          git pull --rebase origin main
          git push origin main